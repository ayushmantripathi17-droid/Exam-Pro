<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NFSU Study Tracker v8 — B.Sc. LL.B. Sem II</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08080f;font-family:'Palatino Linotype','Book Antiqua',Palatino,serif;color:#EDE8E0;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0d0d14}
::-webkit-scrollbar-thumb{background:#2a2a3a;border-radius:3px}

/* ── ANIMATIONS ── */
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInLeft{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeInRight{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 #FFE66D44}50%{box-shadow:0 0 0 12px #FFE66D00}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes alarmRing{0%,100%{transform:rotate(0deg)}10%{transform:rotate(-8deg)}20%{transform:rotate(8deg)}30%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}50%{transform:rotate(0deg)}}
@keyframes alarmFlash{0%,100%{background:#08080f}50%{background:#1a1000}}
@keyframes toastSlide{from{opacity:0;transform:translateX(120%)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(120%)}}
@keyframes countdownPulse{0%,100%{color:#FFE66D}50%{color:#ff6b35}}
@keyframes starFloat{0%{opacity:0;transform:translateY(0) scale(0)}50%{opacity:1}100%{opacity:0;transform:translateY(-60px) scale(1.5)}}
@keyframes tickAnim{0%{transform:scale(1.3);opacity:0.5}100%{transform:scale(1);opacity:1}}
@keyframes progressGlow{0%,100%{box-shadow:none}50%{box-shadow:0 0 8px var(--glow)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.fade-in{animation:fadeInUp 0.35s ease forwards}
.fade-left{animation:fadeInLeft 0.3s ease forwards}
.fade-right{animation:fadeInRight 0.3s ease forwards}
.float-anim{animation:float 3s ease-in-out infinite}
.pulse-anim{animation:pulse 2s ease-in-out infinite}

/* ── HEADER ── */
.header{border-bottom:1px solid #141420;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#08080fee;backdrop-filter:blur(12px);z-index:200;flex-wrap:wrap;gap:8px}
.header-title{font-size:17px;font-weight:bold;letter-spacing:0.5px;background:linear-gradient(90deg,#FFE66D,#ff6b35,#FFE66D);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 4s ease infinite}
.header-sub{font-size:9px;letter-spacing:3px;color:#444;text-transform:uppercase}
.clock-display{font-size:22px;font-weight:bold;color:#FFE66D;letter-spacing:2px;font-variant-numeric:tabular-nums;text-shadow:0 0 20px #FFE66D44;font-family:monospace}
.date-display{font-size:10px;color:#555;letter-spacing:1px;text-align:center}
.nav-bar{display:flex;gap:3px;background:#0f0f18;border:1px solid #1e1e2e;border-radius:24px;padding:4px;flex-wrap:wrap}
.nav-pill{background:none;border:none;cursor:pointer;padding:8px 13px;font-family:inherit;font-size:11px;letter-spacing:0.5px;text-transform:uppercase;transition:all 0.25s;color:#555;border-radius:20px;position:relative;overflow:hidden}
.nav-pill::before{content:'';position:absolute;inset:0;background:#FFE66D;border-radius:20px;transform:scale(0);transition:transform 0.3s;z-index:-1}
.nav-pill:hover{color:#aaa}
.nav-pill.active{background:#FFE66D;color:#08080f;font-weight:bold;transform:scale(1.02)}

/* ── LAYOUT ── */
.container{max-width:880px;margin:0 auto;padding:24px 16px}

/* ── CARDS ── */
.card{background:#0f0f18;border:1px solid #1e1e2e;border-radius:14px;padding:18px;transition:all 0.25s;margin-bottom:10px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#ffffff08,transparent);pointer-events:none}
.card:hover{border-color:#2e2e3e;transform:translateY(-1px);box-shadow:0 8px 24px #00000044}
.card-glow{border-color:var(--glow-color,#FFE66D44)!important;box-shadow:0 0 20px var(--glow-color,#FFE66D11)!important}

/* ── PROGRESS ── */
.pbar{height:6px;background:#1a1a24;border-radius:3px;overflow:hidden;margin-top:10px}
.pfill{height:100%;border-radius:3px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1);position:relative}
.pfill::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);animation:shimmer 2s infinite}

/* ── TOPICS ── */
.topic-row{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:all 0.2s}
.topic-row:hover{background:#14141e;padding-left:14px}
.cb{width:20px;height:20px;border:2px solid #333;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all 0.3s;font-size:11px;font-weight:bold;color:#08080f}
.cb.done{background:var(--acc,#FFE66D);border-color:var(--acc,#FFE66D);animation:tickAnim 0.3s ease}

/* ── BUTTONS ── */
.pill-btn{border:1px solid #222;cursor:pointer;padding:6px 13px;border-radius:20px;font-family:inherit;font-size:11px;transition:all 0.25s;background:#0f0f18;color:#666}
.pill-btn:hover{border-color:#444;color:#aaa;transform:translateY(-1px)}
.btn-gold{background:linear-gradient(135deg,#FFE66D,#ffb700);color:#08080f;border:none;padding:10px 22px;border-radius:10px;font-family:inherit;font-size:13px;cursor:pointer;font-weight:bold;letter-spacing:0.5px;transition:all 0.25s;box-shadow:0 4px 15px #FFE66D22}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 25px #FFE66D33}
.btn-gold:active{transform:translateY(0)}
.btn-ghost{background:none;border:1px solid #333;color:#888;padding:8px 16px;border-radius:8px;font-family:inherit;font-size:12px;cursor:pointer;transition:all 0.2s}
.btn-ghost:hover{border-color:#555;color:#ccc}
.btn-danger{background:none;border:1px solid #663333;color:#cc5555;padding:6px 14px;border-radius:8px;font-family:inherit;font-size:12px;cursor:pointer;transition:all 0.2s}
.btn-danger:hover{background:#1a0808;border-color:#aa3333}
.icon-btn{background:none;border:none;cursor:pointer;padding:5px;border-radius:6px;transition:all 0.2s;font-size:14px;color:#555}
.icon-btn:hover{background:#1e1e2e;color:#aaa;transform:scale(1.1)}

/* ── INPUTS ── */
input,textarea,select{background:#0f0f18;border:1px solid #222;border-radius:8px;color:#ccc;padding:10px 12px;font-family:inherit;font-size:13px;outline:none;transition:all 0.2s;width:100%}
input:focus,textarea:focus,select:focus{border-color:#FFE66D44;box-shadow:0 0 0 3px #FFE66D08}
select option{background:#0f0f18;color:#ccc}
textarea{resize:vertical}
input[type=range]{-webkit-appearance:none;height:5px;background:#222;border-radius:3px;outline:none;padding:0;border:none;box-shadow:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:linear-gradient(135deg,#FFE66D,#ffb700);border-radius:50%;cursor:pointer;box-shadow:0 2px 8px #FFE66D44}
input[type=time]{color-scheme:dark}

/* ── MISC ── */
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;margin:2px;background:#1a1a2a;color:#888;transition:all 0.2s}
.tag:hover{background:#2a2a3a;color:#aaa}
.mood-btn{background:none;border:2px solid transparent;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:24px;transition:all 0.25s}
.mood-btn.sel{border-color:#FFE66D;background:#1e1e10;transform:scale(1.2);box-shadow:0 0 12px #FFE66D33}
.section-label{font-size:10px;letter-spacing:2px;color:#444;text-transform:uppercase;margin-bottom:12px}
.stat-box{background:#0f0f18;border:1px solid #1e1e2e;border-radius:12px;padding:14px 10px;text-align:center;transition:all 0.25s}
.stat-box:hover{border-color:#333;transform:translateY(-2px);box-shadow:0 8px 20px #00000033}
.mat-card{background:#0f0f18;border:1px solid #1e1e2e;border-radius:12px;padding:16px;transition:all 0.25s;position:relative;margin-bottom:12px}
.mat-card:hover{border-color:#333;transform:translateY(-2px);box-shadow:0 6px 20px #00000033}
.mat-card.pinned{border-color:#FFE66D55;box-shadow:0 0 15px #FFE66D08}
.empty-state{text-align:center;padding:48px 0;color:#333}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flex-wrap{display:flex;flex-wrap:wrap;gap:6px}
.ring-container{position:relative;width:130px;height:130px;flex-shrink:0}
.ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* ── TOAST ── */
.toast{position:fixed;top:20px;right:20px;padding:12px 22px;border-radius:12px;font-weight:bold;font-size:13px;z-index:9999;display:none;min-width:200px;box-shadow:0 8px 24px #00000066}
.toast.show{display:block;animation:toastSlide 0.4s ease}
.toast.hiding{animation:toastOut 0.3s ease forwards}
.toast-success{background:linear-gradient(135deg,#06D6A0,#059669);color:#fff}
.toast-alarm{background:linear-gradient(135deg,#FF6B35,#cc3300);color:#fff}
.toast-info{background:linear-gradient(135deg,#FFE66D,#ffb700);color:#08080f}

/* ── ALARM OVERLAY ── */
.alarm-overlay{display:none;position:fixed;inset:0;background:#00000088;z-index:9998;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.alarm-overlay.show{display:flex;animation:fadeInUp 0.3s ease}
.alarm-box{background:#0f0f18;border:2px solid #FF6B35;border-radius:20px;padding:36px;text-align:center;max-width:340px;width:90%;animation:alarmRing 0.5s ease 3,alarmFlash 0.5s ease 6}
.alarm-icon{font-size:60px;animation:float 1s ease-in-out infinite,alarmRing 0.6s ease infinite}

/* ── STAR BURST ── */
.star{position:fixed;pointer-events:none;font-size:20px;animation:starFloat 1s ease-out forwards;z-index:9997}

/* ── TIMER ── */
.timer-ring{transition:stroke-dashoffset 1s linear}
.countdown-num{animation:countdownPulse 1s ease-in-out infinite}

/* ── ALARM LIST ── */
.alarm-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#111;border:1px solid #1e1e2e;border-radius:10px;margin-bottom:8px;transition:all 0.2s}
.alarm-item:hover{border-color:#333}
.alarm-item.active-alarm{border-color:#FF6B3566;background:#1a0f0a}
.alarm-toggle{width:40px;height:22px;border-radius:11px;background:#222;border:none;cursor:pointer;position:relative;transition:background 0.3s;flex-shrink:0}
.alarm-toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#555;transition:all 0.3s}
.alarm-toggle.on{background:#FF6B35}
.alarm-toggle.on::after{left:21px;background:#fff}

/* ── FILES ── */
.drop-zone{border:2px dashed #2a2a3a;border-radius:14px;padding:36px 20px;text-align:center;cursor:pointer;transition:all 0.3s;background:#0a0a12}
.drop-zone:hover,.drop-zone.drag-over{border-color:#FFE66D;background:#12120a;box-shadow:0 0 24px #FFE66D11}
.file-card{background:#0f0f18;border:1px solid #1e1e2e;border-radius:12px;overflow:hidden;transition:all 0.25s;cursor:pointer}
.file-card:hover{border-color:#333;transform:translateY(-2px);box-shadow:0 6px 20px #00000033}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.file-thumb{width:100%;height:110px;object-fit:cover;display:block;background:#111}
.file-thumb-placeholder{width:100%;height:110px;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,#111,#0a0a18)}
.file-info{padding:10px 12px}
.file-name{font-size:12px;font-weight:bold;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:10px;color:#444;margin-top:3px}
.preview-overlay{display:none;position:fixed;inset:0;background:#000000cc;z-index:9999;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.preview-overlay.show{display:flex;animation:fadeInUp 0.3s ease}
.preview-box{background:#0f0f18;border:1px solid #2a2a3a;border-radius:16px;max-width:92vw;max-height:90vh;width:860px;overflow:hidden;display:flex;flex-direction:column}
.preview-header{padding:14px 18px;border-bottom:1px solid #1e1e2e;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.preview-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:16px;min-height:200px}
.storage-bar{height:8px;background:#1a1a24;border-radius:4px;overflow:hidden;margin-top:6px}
.storage-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#06D6A0,#FFE66D);transition:width 0.5s ease}
@media(max-width:600px){.grid-3{grid-template-columns:1fr 1fr}.header{padding:10px 14px}.nav-pill{padding:7px 9px;font-size:10px}.clock-display{font-size:18px}.file-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
</style>
</head>

const DRIVE_SCOPES="https://www.googleapis.com/auth/drive.file";

function loadGISScript(){
  return new Promise(resolve=>{
    if(window.google?.accounts?.oauth2){resolve();return;}
    const s=document.createElement("script");
    s.src="https://accounts.google.com/gsi/client";
    s.onload=resolve;
    s.onerror=()=>{console.warn("GIS failed");resolve();};
    document.head.appendChild(s);
  });
}

async function initDriveAuth(clientId){
  if(!clientId){showToast("⚠️ Enter your Google Client ID first","alarm");return;}
  driveClientId=clientId;
  localStorage.setItem("nfsu_driveClientId",clientId);
  driveStatus="connecting";
  updateDriveBadge();
  await loadGISScript();
  if(!window.google?.accounts?.oauth2){
    driveStatus="error";updateDriveBadge();
    showToast("⚠️ Could not load Google auth","alarm");return;
  }
  driveTokenClient=google.accounts.oauth2.initTokenClient({
    client_id:clientId,
    scope:DRIVE_SCOPES,
    callback:(resp)=>{
      if(resp.error){driveStatus="error";updateDriveBadge();showToast("⚠️ Drive auth failed","alarm");return;}
      driveAccessToken=resp.access_token;
      driveStatus="ready";
      updateDriveBadge();
      showToast("✅ Google Drive connected!","success");
      spawnStars();
      ensureDriveFolder().then(()=>processUploadQueue());
      render();
    }
  });
  driveTokenClient.requestAccessToken({prompt:"consent"});
}

function disconnectDrive(){
  driveAccessToken=null;driveTokenClient=null;driveFolderId=null;
  driveStatus="disconnected";driveUploadQueue=[];
  updateDriveBadge();

}

async function ensureDriveFolder(){
  if(!driveAccessToken) return null;
  if(driveFolderId) return driveFolderId;
  try{
    const q=encodeURIComponent("name=\'NFSU-Tracker\' and mimeType=\'application/vnd.google-apps.folder\' and trashed=false");
    const res=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,{headers:{Authorization:"Bearer "+driveAccessToken}});
    const data=await res.json();
    if(data.files&&data.files.length>0){
      driveFolderId=data.files[0].id;
    } else {
      const cr=await fetch("https://www.googleapis.com/drive/v3/files",{
        method:"POST",
        headers:{Authorization:"Bearer "+driveAccessToken,"Content-Type":"application/json"},
        body:JSON.stringify({name:"NFSU-Tracker",mimeType:"application/vnd.google-apps.folder"})
      });
      const fd=await cr.json();
      driveFolderId=fd.id;
      showToast("📁 Created \'NFSU-Tracker\' folder in Drive","success");
    }
    return driveFolderId;
  }catch(e){console.warn("Drive folder error:",e);driveStatus="error";updateDriveBadge();return null;}
}

async function uploadFileToDrive(fileObj){
  if(!driveAccessToken||!driveFolderId||!fileObj.data) return false;
  try{
    const arr=fileObj.data.split(",");
    const mime=arr[0].match(/:(.*?);/)[1];
    const bstr=atob(arr[1]);
    const u8=new Uint8Array(bstr.length);
    for(let i=0;i<bstr.length;i++) u8[i]=bstr.charCodeAt(i);
    const blob=new Blob([u8],{type:mime});

    const q=encodeURIComponent(`name=\'${fileObj.name.replace(/\'/g,"\\'")}\' and \'${driveFolderId}\' in parents and trashed=false`);
    const searchRes=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`,{headers:{Authorization:"Bearer "+driveAccessToken}});
    const searchData=await searchRes.json();
    let uploadRes;
    if(searchData.files&&searchData.files.length>0){
      const existingId=searchData.files[0].id;
      uploadRes=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=media`,{
        method:"PATCH",headers:{Authorization:"Bearer "+driveAccessToken,"Content-Type":mime},body:blob
      });
    } else {
      const metadata={name:fileObj.name,parents:[driveFolderId]};
      const form=new FormData();
      form.append("metadata",new Blob([JSON.stringify(metadata)],{type:"application/json"}));
      form.append("file",blob);
      uploadRes=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink",{
        method:"POST",headers:{Authorization:"Bearer "+driveAccessToken},body:form
      });
    }
    if(uploadRes.ok){
      const ud=await uploadRes.json();
      const f=state.files.find(f=>f.id===fileObj.id);
      if(f){f.driveId=ud.id;f.driveLink=ud.webViewLink||null;LS("files",state.files);}
      return true;
    }
    return false;
  }catch(e){console.warn("Drive upload error:",e);return false;}
}

function queueDriveUpload(fileId){
  if(!driveUploadQueue.includes(fileId)) driveUploadQueue.push(fileId);
  if(driveStatus==="ready") processUploadQueue();
}

async function processUploadQueue(){
  if(driveUploading||driveStatus!=="ready"||!driveFolderId||driveUploadQueue.length===0) return;
  driveUploading=true;
  while(driveUploadQueue.length>0){
    const fid=driveUploadQueue[0];
    const fileObj=state.files.find(f=>f.id===fid);
    if(fileObj&&fileObj.data){
      const ok=await uploadFileToDrive(fileObj);
      if(ok){driveUploadQueue.shift();showToast(`☁️ "${fileObj.name}" saved to Drive`,"success");render();}
      else break;
    } else {driveUploadQueue.shift();}
  }
  driveUploading=false;
}

async function manualDriveSync(){
  if(driveStatus!=="ready"){showToast("⚠️ Connect Drive first","alarm");return;}
  const folder=await ensureDriveFolder();
  if(!folder) return;
  showToast("🔄 Uploading all files to Drive…","info");
  let count=0;
  for(const f of state.files){
    if(f.data&&!f.driveId){const ok=await uploadFileToDrive(f);if(ok) count++;}
  }
  showToast(`✅ Uploaded ${count} file(s) to Drive`,"success");
  render();
}

async function initFirebase(){
  try{
    const {initializeApp,getApps}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const {getFirestore}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const {getAuth,GoogleAuthProvider,signInWithRedirect,getRedirectResult,signOut,onAuthStateChanged}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");

    let app;
    if(getApps().length===0) app=initializeApp(FIREBASE_CONFIG);
    else app=getApps()[0];

    db=getFirestore(app);
    auth=getAuth(app);

    // Handle redirect result first (after Google sign-in redirect)
    try{
      const result=await getRedirectResult(auth);
      if(result?.user){
        showToast("✅ Signed in as "+result.user.displayName,"success");
        spawnStars();
      }
    }catch(e){console.warn("Redirect result error:",e);}

    // Listen for auth state
    onAuthStateChanged(auth, user=>{
      if(user){
        currentUser=user;
        syncUserId=user.uid;
        localStorage.setItem("nfsu_userId", user.uid);
        syncStatus="connecting";
        updateSyncBadge();
        updateUserBadge();
        subscribeToFirestore();
        render();
      } else {
        currentUser=null;
        syncUserId=null;
        syncStatus="offline";
        if(unsubscribeFn){unsubscribeFn();unsubscribeFn=null;}
        db && updateSyncBadge();
        updateUserBadge();
        render();
      }
    });

    return true;
  }catch(e){
    console.warn("Firebase init failed:",e);
    syncStatus="error";
    updateSyncBadge();
    return false;
  }
}

async function subscribeToFirestore(){
  if(!db||!syncUserId) return;
  try{
    const {doc,onSnapshot}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const docRef=doc(db,"nfsu_tracker",syncUserId);
    if(unsubscribeFn) unsubscribeFn();
    unsubscribeFn=onSnapshot(docRef,
      snap=>{
        if(snap.exists()){
          const remote=snap.data();
          const keys=["progress","studyLog","mood","hoursToday","subjectNotes","materials","alarms"];
          keys.forEach(k=>{if(remote[k]!==undefined) state[k]=remote[k];});
          syncStatus="synced";
          updateSyncBadge();
          render();
        } else {
          pushToFirebase();
        }
      },
      err=>{console.warn("Sync error:",err);syncStatus="error";updateSyncBadge();}
    );
  }catch(e){console.warn("Subscribe failed:",e);}
}

async function pushToFirebase(){
  if(!db||!syncUserId) return;
  try{
    const {doc,setDoc}=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const data={
      progress:state.progress, studyLog:state.studyLog,
      mood:state.mood, hoursToday:state.hoursToday,
      subjectNotes:state.subjectNotes, materials:state.materials,
      alarms:state.alarms, updatedAt:Date.now()
    };
    await setDoc(doc(db,"nfsu_tracker",syncUserId),data);
    syncStatus="synced";
    updateSyncBadge();
  }catch(e){console.warn("Push failed:",e);}
}

function checkAlarms(){
  const now=new Date();
  const hm=`${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  const dayIdx=now.getDay(); // 0=Sun
  state.alarms.forEach(alarm=>{
    if(!alarm.enabled) return;
    if(alarm.time!==hm) return;
    if(now.getSeconds()!==0) return;
    const dayOk=!alarm.repeat || alarm.days.length===0 || alarm.days.includes(dayIdx);
    if(!dayOk) return;
    triggerAlarm(alarm);
  });
}

function triggerAlarm(alarm){
  document.getElementById("alarm-title").textContent=alarm.label||"Study Time!";
  document.getElementById("alarm-msg").textContent=`Alarm set for ${alarm.time}`;
  document.getElementById("alarm-icon").textContent="⏰";
  document.getElementById("alarm-overlay").classList.add("show");
  playAlarmSound();
  spawnStars();
}

function dismissAlarm(){
  document.getElementById("alarm-overlay").classList.remove("show");
  stopAlarmSound();
}

function playAlarmSound(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    function beep(freq,start,dur){
      const o=ctx.createOscillator();
      const g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=freq;
      o.type="sine";
      g.gain.setValueAtTime(0,ctx.currentTime+start);
      g.gain.linearRampToValueAtTime(0.4,ctx.currentTime+start+0.05);
      g.gain.linearRampToValueAtTime(0,ctx.currentTime+start+dur);
      o.start(ctx.currentTime+start);
      o.stop(ctx.currentTime+start+dur+0.1);
    }
    for(let i=0;i<6;i++){beep(880,i*0.4,0.25);beep(1100,i*0.4+0.25,0.15);}
    activeAlarmAudio=ctx;
  }catch(e){}
}

function stopAlarmSound(){
  try{if(activeAlarmAudio)activeAlarmAudio.close();}catch(e){}
  activeAlarmAudio=null;
}

function spawnStars(){
  const icons=["⭐","✨","🌟","💫","🎯","📚"];
  for(let i=0;i<12;i++){
    setTimeout(()=>{
      const s=document.createElement("div");
      s.className="star";
      s.textContent=icons[Math.floor(Math.random()*icons.length)];
      s.style.left=Math.random()*100+"vw";
      s.style.top=Math.random()*60+20+"vh";
      s.style.fontSize=(16+Math.random()*16)+"px";
      s.style.animationDuration=(0.8+Math.random()*0.6)+"s";
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),1400);
    },i*80);
  }
}

function startTimer(){
  if(timerInterval) return;
  state.timerRunning=true;
  timerInterval=setInterval(()=>{
    if(state.timerSeconds>0){
      state.timerSeconds--;
      updateTimerDisplay();
    } else {
      clearInterval(timerInterval); timerInterval=null; state.timerRunning=false;
      showToast("🎉 Session complete!","success");
      spawnStars();
      playAlarmSound();
      setTimeout(stopAlarmSound,3000);
    }
  },1000);
  updateTimerDisplay();
}

function pauseTimer(){
  clearInterval(timerInterval); timerInterval=null; state.timerRunning=false;
  updateTimerDisplay();
}

function resetTimer(seconds){
  clearInterval(timerInterval); timerInterval=null; state.timerRunning=false;
  state.timerSeconds=seconds||25*60;
  updateTimerDisplay();
}

function updateTimerDisplay(){
  const m=Math.floor(state.timerSeconds/60);
  const s=state.timerSeconds%60;
  const el=document.getElementById("timer-display");
  if(el) el.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  // SVG ring
  const total=state.timerMode==="study"?25*60:state.timerMode==="short"?5*60:15*60;
  const pct=state.timerSeconds/total;
  const circ=2*Math.PI*54;
  const el2=document.getElementById("timer-ring-fill");
  if(el2) el2.style.strokeDashoffset=circ*(1-pct);
}

function getDaysLeft(examDate){
  const [day,mon]=examDate.split(" ");
  const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  return Math.ceil((new Date(2026,months[mon],parseInt(day))-new Date())/86400000);
}
function getSubjectPct(sid){
  const sub=SUBJECTS.find(s=>s.id===sid);
  let total=0,done=0;
  sub.units.forEach(u=>u.topics.forEach((_,i)=>{total++;if(state.progress[`${sid}-${u.id}-${i}`])done++;}));
  return total?Math.round((done/total)*100):0;
}
function getTotalPct(){
  let total=0,done=0;
  SUBJECTS.forEach(s=>s.units.forEach(u=>u.topics.forEach((_,i)=>{total++;if(state.progress[`${s.id}-${u.id}-${i}`])done++;})));
  return total?Math.round((done/total)*100):0;
}
function getTotalHours(){return Object.values(state.studyLog).reduce((s,d)=>s+(d.hours||0),0);}
function getStreak(){
  let streak=0;const d=new Date();
  while(streak<366){
    const k=d.toISOString().split("T")[0];
    if(state.studyLog[k]?.hours>0){streak++;d.setDate(d.getDate()-1);}else break;
  }
  return streak;
}

function showAddForm(){state.showAddForm=true;state.editingMatId=null;state.newMat={subjectId:"cpp",type:"📝 Note",title:"",content:"",tags:""};render();}
function hideAddForm(){state.showAddForm=false;render();}
function updateNewMat(f,v){state.newMat[f]=v;}

function addMaterial(){
  const m=state.newMat;
  const title=document.getElementById("new-title")?.value||m.title;
  const content=document.getElementById("new-content")?.value||m.content;
  const tags=document.getElementById("new-tags")?.value||m.tags;
  const subjectId=document.getElementById("new-sub")?.value||m.subjectId;
  const type=document.getElementById("new-type")?.value||m.type;
  if(!title.trim()||!content.trim()){showToast("⚠️ Fill title and content","alarm");return;}
  const mat={id:genId(),subjectId,type,title,content,tags:tags.split(",").map(t=>t.trim()).filter(Boolean),created:today(),pinned:false};
  state.materials.unshift(mat);
  S("materials",state.materials);
  state.showAddForm=false;
  showToast("✅ Material saved!","success");
  spawnStars();
  render();
}

function deleteMaterial(id){
  if(!confirm("Delete this material?"))return;
  state.materials=state.materials.filter(m=>m.id!==id);
  S("materials",state.materials);
  showToast("🗑️ Deleted","info");
  render();
}

function togglePin(id){
  const m=state.materials.find(m=>m.id===id);
  if(m){m.pinned=!m.pinned;S("materials",state.materials);render();}
}

function startEdit(id){state.editingMatId=id;state.showAddForm=false;render();}
function cancelEdit(){state.editingMatId=null;render();}

function saveEdit(id){
  const title=document.getElementById("edit-title")?.value||"";
  const content=document.getElementById("edit-content")?.value||"";
  const tags=document.getElementById("edit-tags")?.value||"";
  const subjectId=document.getElementById("edit-sub")?.value||"cpp";
  const type=document.getElementById("edit-type")?.value||"📝 Note";
  if(!title.trim()||!content.trim()){showToast("⚠️ Fill title and content","alarm");return;}
  const m=state.materials.find(m=>m.id===id);
  if(m)Object.assign(m,{title,content,subjectId,type,tags:tags.split(",").map(t=>t.trim()).filter(Boolean)});
  S("materials",state.materials);
  state.editingMatId=null;
  showToast("✅ Updated!","success");
  render();
}

// ALARM ACTIONS
function saveNewAlarm(){
  const time=document.getElementById("al-time")?.value||"07:00";
  const label=document.getElementById("al-label")?.value||"Study Time";
  const repeat=document.getElementById("al-repeat")?.checked||false;
  const alarm={id:genId(),time,label,enabled:true,repeat,days:[]};
  state.alarms.push(alarm);
  S("alarms",state.alarms);
  showToast("⏰ Alarm set for "+time,"success");
  render();
}

function deleteAlarm(id){
  state.alarms=state.alarms.filter(a=>a.id!==id);
  S("alarms",state.alarms);
  render();
}

function toggleAlarm(id){
  const a=state.alarms.find(a=>a.id===id);
  if(a){a.enabled=!a.enabled;S("alarms",state.alarms);render();}
}

// TIMER ACTIONS
function setTimerMode(mode){
  state.timerMode=mode;
  clearInterval(timerInterval);timerInterval=null;state.timerRunning=false;
  const secs={study:25*60,short:5*60,long:15*60};
  state.timerSeconds=secs[mode];
  render();
}

// ══════════════════════════════════════════════════════════════
// FILE FUNCTIONS
// ══════════════════════════════════════════════════════════════
function getFileIcon(type,name){
  if(!type&&!name) return "📄";
  const ext=(name||"").split(".").pop().toLowerCase();
  if(type.includes("pdf")||ext==="pdf") return "📕";
  if(type.includes("image")||["jpg","jpeg","png","gif","webp"].includes(ext)) return "🖼️";
  if(type.includes("spreadsheet")||["xlsx","xls","csv"].includes(ext)) return "📊";
  if(type.includes("word")||ext==="docx") return "📘";
  if(type.includes("presentation")||ext==="pptx") return "📙";
  if(type.includes("text")||ext==="txt") return "📄";
  if(type.includes("video")||["mp4","mov"].includes(ext)) return "🎬";
  if(type.includes("audio")||["mp3","wav"].includes(ext)) return "🎵";
  return "📁";
}

function formatSize(bytes){
  if(bytes<1024) return bytes+"B";
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+"KB";
  return (bytes/(1024*1024)).toFixed(1)+"MB";
}

function getStorageUsedMB(){
  try{
    let total=0;
    for(let k in localStorage){if(k.startsWith("nfsu_"))total+=localStorage[k].length;}
    return (total*2/(1024*1024)).toFixed(1); // UTF-16 = 2 bytes per char
  }catch(e){return 0;}
}

function handleFileSelect(files){
  const sid=document.getElementById("file-sub-select")?.value||"cpp";
  Array.from(files).forEach(file=>{
    if(file.size>8*1024*1024){showToast("⚠️ "+file.name+" is over 8MB — try a smaller file","alarm");return;}
    const reader=new FileReader();
    reader.onload=e=>{
      const fileObj={
        id:genId(), name:file.name, size:file.size,
        type:file.type, subjectId:sid,
        data:e.target.result, // base64 data URL
        created:today(), note:""
      };
      state.files.unshift(fileObj);
      try{S("files",state.files);}catch(e){
        // localStorage full — store without data, just metadata
        state.files[0].data=null;
        state.files[0].note="⚠️ File too large to store offline. Re-upload to view.";
        try{S("files",state.files);}catch(e2){state.files.shift();}
        showToast("⚠️ Storage full — metadata saved only","alarm");
        render(); return;
      }
      showToast("✅ "+file.name+" uploaded!","success");
      spawnStars();
      // Auto-sync to Google Drive if connected
      queueDriveUpload(fileObj.id);
      render();
    };
    reader.readAsDataURL(file);
  });
}

function deleteFile(id){
  if(!confirm("Delete this file?")) return;
  state.files=state.files.filter(f=>f.id!==id);
  S("files",state.files);
  showToast("🗑️ File deleted","info");
  render();
}

function updateFileNote(id,note){
  const f=state.files.find(f=>f.id===id);
  if(f){f.note=note;S("files",state.files);}
}

function updateFileSubject(id,sid){
  const f=state.files.find(f=>f.id===id);
  if(f){f.subjectId=sid;S("files",state.files);render();}
}

function openPreview(id){
  const f=state.files.find(f=>f.id===id);
  if(!f) return;
  if(!f.data){showToast("⚠️ File data not available — re-upload to preview","alarm");return;}
  const overlay=document.getElementById("preview-overlay");
  document.getElementById("preview-name").textContent=f.name;
  document.getElementById("preview-meta").textContent=formatSize(f.size)+" · Uploaded "+f.created;
  const body=document.getElementById("preview-body");
  const sub=SUBJECTS.find(s=>s.id===f.subjectId);

  // Download button
  const dlBtn=document.getElementById("preview-download");
  dlBtn.onclick=()=>{
    const a=document.createElement("a");
    a.href=f.data; a.download=f.name; a.click();
  };

  if(f.type.includes("image")){
    body.innerHTML=`<img src="${f.data}" style="max-width:100%;max-height:65vh;border-radius:8px;object-fit:contain"/>`;
  } else if(f.type.includes("pdf")){
    body.innerHTML=`<iframe src="${f.data}" style="width:100%;height:65vh;border:none;border-radius:8px" title="${esc(f.name)}"></iframe>`;
  } else if(f.type.includes("text")||f.name.endsWith(".txt")||f.name.endsWith(".csv")){
    // Decode text
    try{
      const base64=f.data.split(",")[1];
      const text=atob(base64);
      body.innerHTML=`<pre style="font-size:12px;color:#aaa;text-align:left;white-space:pre-wrap;max-height:65vh;overflow:auto;padding:16px;background:#0a0a12;border-radius:8px;width:100%">${esc(text.slice(0,8000))}${text.length>8000?"...(truncated)":""}</pre>`;
    }catch(e){body.innerHTML=`<div style="color:#888">Cannot preview this file type.<br>Click Download to open it.</div>`;}
  } else {
    const icon=getFileIcon(f.type,f.name);
    body.innerHTML=`<div style="text-align:center;padding:32px">
      <div style="font-size:80px;margin-bottom:16px">${icon}</div>
      <div style="font-size:16px;font-weight:bold;color:#ccc;margin-bottom:8px">${esc(f.name)}</div>
      <div style="font-size:13px;color:#555;margin-bottom:20px">${formatSize(f.size)} · ${f.type||"Unknown type"}</div>
      <div style="font-size:12px;color:#444">Preview not available for this file type.</div>
      <div style="font-size:12px;color:#444">Click Download to open it.</div>
    </div>`;
  }
  overlay.classList.add("show");
}

function closePreview(){
  document.getElementById("preview-overlay").classList.remove("show");
  document.getElementById("preview-body").innerHTML="";
}

        <div style="font-size:11px;color:${storageColor}">${usedMB}MB / ~${limitMB}MB</div>
      </div>
      <div class="storage-bar"><div class="storage-fill" style="width:${usedPct}%;background:linear-gradient(90deg,#06D6A0,${storageColor})"></div></div>
      <div style="font-size:10px;color:#333;margin-top:6px">⚠️ Files are stored in your browser. Max ~5MB total. For large files, use Google Drive and paste the link in Materials.</div>
    </div>

    <!-- Drop zone -->
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()"
      ondragover="event.preventDefault();this.classList.add('drag-over')"
      ondragleave="this.classList.remove('drag-over')"
      ondrop="event.preventDefault();this.classList.remove('drag-over');handleFileSelect(event.dataTransfer.files)">
      <div style="font-size:42px;margin-bottom:12px">📂</div>
      <div style="font-size:15px;font-weight:bold;color:#ccc;margin-bottom:6px">Drop files here or click to browse</div>
      <div style="font-size:12px;color:#444">PDF, Images (JPG/PNG), Excel, Word, CSV, TXT · Max 8MB per file</div>
      <div style="margin-top:14px;display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap">
        <div style="font-size:11px;color:#333">Assign to subject:</div>
        <select id="file-sub-select" onclick="event.stopPropagation()" style="width:auto;padding:6px 10px;font-size:12px">
          ${SUBJECTS.map(s=>`<option value="${s.id}">${s.icon} ${esc(s.name)}</option>`).join("")}
        </select>
      </div>
    </div>

    <!-- Filters + Search -->
    <div style="margin:18px 0 10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <input placeholder="🔍 Search files..." oninput="state.fileSearch=this.value;render()" value="${esc(state.fileSearch)}" style="max-width:220px;padding:8px 12px;font-size:12px"/>
    </div>
    ${subFilterBtns}

    <!-- Supported formats info -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      ${[["📕","PDF"],["🖼️","Images"],["📊","Excel/CSV"],["📘","Word"],["📙","PPT"],["📄","Text"]].map(([ic,lb])=>`
        <div style="background:#111;border:1px solid #1e1e2e;border-radius:8px;padding:5px 10px;font-size:11px;color:#555">${ic} ${lb}</div>`).join("")}
    </div>

    <!-- File cards -->
    ${fileCards}

    <!-- Tip box -->
    <div style="background:#0f0f18;border:1px solid #1e1e2e;border-radius:10px;padding:14px;margin-top:16px">
      <div style="font-size:11px;color:#444;letter-spacing:1px;margin-bottom:8px">💡 TIPS</div>
      <div style="font-size:12px;color:#555;line-height:1.8">
        • For large files (syllabus PDFs, textbooks) — upload to <b style="color:#4ECDC4">Google Drive</b> and save the link in Materials<br>
        • Images and small PDFs work best here (under 2MB each)<br>
        • Files are saved in <b style="color:#FFE66D">this browser only</b> — they won't transfer to another device<br>
        • Use the Download button in preview to save a copy anywhere
      </div>
    </div>
  </div>`;
}

// ── EXPORT / IMPORT ──────────────────────────────────────────
function exportData(){
  const data={
    progress:state.progress, studyLog:state.studyLog,
    mood:state.mood, hoursToday:state.hoursToday,
    subjectNotes:state.subjectNotes, materials:state.materials,
    alarms:state.alarms, exportedAt:new Date().toISOString()
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=`nfsu_backup_${today()}.json`; a.click();
  URL.revokeObjectURL(url);
  showToast("✅ Data exported!","success");
}

function importData(input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(data.progress) state.progress=data.progress;
      if(data.studyLog) state.studyLog=data.studyLog;
      if(data.mood!==undefined) state.mood=data.mood;
      if(data.hoursToday!==undefined) state.hoursToday=data.hoursToday;
      if(data.subjectNotes) state.subjectNotes=data.subjectNotes;
      if(data.materials) state.materials=data.materials;
      if(data.alarms) state.alarms=data.alarms;
      // Save all locally
      ["progress","studyLog","mood","hoursToday","subjectNotes","materials","alarms"].forEach(k=>LS(k,state[k]));
      // Push to Firebase if connected
      pushToFirebase();
      showToast("✅ Data imported successfully!","success");
      spawnStars();
      render();
    }catch(err){showToast("⚠️ Invalid backup file","alarm");}
  };
  reader.readAsText(file);
  input.value="";
}
